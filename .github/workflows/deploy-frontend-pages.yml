name: Deploy Frontend to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'packages/frontend/**'
# Least-privilege default: only the deploy job needs pages/id-token write,
# so those scopes are set at the job level instead of workflow-wide.
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: packages/frontend
        env:
          VITE_API_URL: https://app-registry-backend.onrender.com
        run: pnpm build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job deploys to Pages, so it holds the elevated scopes.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
