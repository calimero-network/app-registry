name: Deploy to Production

on:
  push:
    tags:
      - 'v*'

# Least-privilege default for the workflow. The deploy job elevates to
# packages:write (GHCR push) at the job level below.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run linting
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Check Docker Hub credentials
        id: docker-hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
            echo "has_credentials=true" >> $GITHUB_OUTPUT
          else
            echo "has_credentials=false" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub (if credentials provided)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: steps.docker-hub.outputs.has_credentials == 'true'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GitHub Container Registry with Kaniko
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./packages/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/calimero-registry-backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/calimero-registry-backend:latest
          platforms: linux/amd64
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Build and push to Docker Hub with Kaniko (if credentials provided)
        if: steps.docker-hub.outputs.has_credentials == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./packages/backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/calimero-registry-backend:${{ github.ref_name }}
            ${{ secrets.DOCKER_USERNAME }}/calimero-registry-backend:latest
          platforms: linux/amd64
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Deploy to production
        env:
          REF_NAME: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          echo "Deploying version $REF_NAME to production"
          echo "Docker image: ghcr.io/$REPO_OWNER/calimero-registry-backend:$REF_NAME"
          # Add your deployment commands here
          # Examples:
          # - Deploy to Kubernetes
          # - Deploy to AWS ECS
          # - Deploy to Google Cloud Run
          # - Deploy to Azure Container Instances

      - name: Notify deployment
        env:
          REF_NAME: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          echo "✅ Successfully deployed Calimero Registry Backend v$REF_NAME"
          echo "🐳 Docker image: ghcr.io/$REPO_OWNER/calimero-registry-backend:$REF_NAME"
          echo "🌐 Health check: https://your-domain.com/healthz"
          echo "📚 API docs: https://your-domain.com/docs"
