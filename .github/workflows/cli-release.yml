name: CLI Release

# TEMPORARILY DISABLED - Testing semantic release workflow
# on:
#   push:
#     tags:
#       - 'cli-v*'
on:
  workflow_dispatch: # Manual trigger only for testing

# Least-privilege default for the workflow.
permissions:
  contents: read

jobs:
  release-cli:
    runs-on: ubuntu-latest
    # Needs contents:write to create the GitHub Release. npm publish uses
    # NPM_TOKEN, not GITHUB_TOKEN, so no extra scope is required for it.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI only
        run: pnpm --filter cli build

      - name: Test CLI only
        run: pnpm --filter cli test

      - name: Setup npm authentication
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          npm config set @xilos:registry https://registry.npmjs.org/

      - name: Publish CLI to npm
        run: |
          cd packages/cli
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        # actions/create-release is ARCHIVED/unmaintained. This workflow is
        # workflow_dispatch-only (not part of normal CI); pinned to the v1
        # commit SHA to remove the moving-tag supply-chain risk.
        # TODO: migrate to a maintained release action (e.g. softprops/action-gh-release).
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: CLI Release ${{ github.ref_name }}
          body: |
            ## CLI Release ${{ github.ref_name }}

            This release contains updates to the Calimero Registry CLI tool.

            ### Installation
            ```bash
            npm install -g @calimero-network/registry-cli
            ```

            ### Usage
            ```bash
            calimero-registry --help
            ```
          draft: false
          prerelease: false
