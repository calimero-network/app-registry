name: Semantic Release

on:
  push:
    branches:
      - main

# Least-privilege default: the detect-changes job only reads the repo.
# The semantic-release job elevates its own scopes at the job level below.
permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      cli-changed: ${{ steps.detect.outputs.cli-changed }}
      backend-changed: ${{ steps.detect.outputs.backend-changed }}
      frontend-changed: ${{ steps.detect.outputs.frontend-changed }}
      monorepo-changed: ${{ steps.detect.outputs.monorepo-changed }}
      release-type: ${{ steps.detect.outputs.release-type }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history for change detection
          persist-credentials: false

      - name: Detect package changes
        id: detect
        run: |
          ./scripts/detect-changes.sh HEAD

  semantic-release:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.cli-changed == 'true' || needs.detect-changes.outputs.backend-changed == 'true' || needs.detect-changes.outputs.frontend-changed == 'true' || needs.detect-changes.outputs.monorepo-changed == 'true'
    # Gate the npm publish behind a protected environment. With required
    # reviewers configured on the `npm-publish` environment, this job pauses for
    # a human approval before it can publish @calimero-network/registry-cli, so
    # a push to main can no longer silently ship the CLI to npm.
    environment: npm-publish
    permissions:
      id-token: write # Required for OIDC/trusted publishers
      contents: write # Required for creating GitHub releases
      issues: write # Required for commenting on issues
      pull-requests: write # Required for commenting on PRs
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24' # Required for semantic-release@25.0.1 and project engines requirement
          registry-url: 'https://registry.npmjs.org'
          scope: '@calimero-network'
          token: false # Disable NPM_AUTH_TOKEN to allow OIDC trusted publishing

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build and test all packages
        run: |
          pnpm build
          pnpm test

      # CLI Package Release
      - name: Release CLI Package
        if: needs.detect-changes.outputs.cli-changed == 'true'
        run: |
          cd packages/cli
          echo "🚀 CLI Release"
          echo "📦 Package: @calimero-network/registry-cli"
          echo "🎯 Release type: $RELEASE_TYPE"
          npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          RELEASE_TYPE: ${{ needs.detect-changes.outputs.release-type }}

      # Backend Release (DRY RUN)
      - name: Release Backend (DRY RUN)
        if: needs.detect-changes.outputs.backend-changed == 'true'
        run: |
          cd packages/backend
          echo "🚀 Backend Release DRY RUN"
          echo "📦 Package: @calimero-network/registry-backend"
          echo "🎯 Release type: $RELEASE_TYPE"
          echo "🏷️  Would create tag: backend-v*"
          echo "📝 Would create GitHub release"
          echo "📊 Changes detected since last Backend release"
          # npx semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          RELEASE_TYPE: ${{ needs.detect-changes.outputs.release-type }}

      # Frontend Release (DRY RUN)
      - name: Release Frontend (DRY RUN)
        if: needs.detect-changes.outputs.frontend-changed == 'true'
        run: |
          cd packages/frontend
          echo "🚀 Frontend Release DRY RUN"
          echo "📦 Package: @calimero-network/registry-frontend"
          echo "🎯 Release type: $RELEASE_TYPE"
          echo "🏷️  Would create tag: frontend-v*"
          echo "📝 Would create GitHub release"
          echo "📊 Changes detected since last Frontend release"
          # npx semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          RELEASE_TYPE: ${{ needs.detect-changes.outputs.release-type }}

      # Monorepo-wide Release
      - name: Release All Packages
        if: needs.detect-changes.outputs.monorepo-changed == 'true'
        run: |
          echo "🚀 Monorepo-wide Release"
          echo "🎯 Release type: $RELEASE_TYPE"
          echo "📦 Releasing all packages with coordinated versioning"
          echo "📊 Monorepo-wide changes detected"
          # Release the CLI package
          if [ "$CLI_CHANGED" == "true" ]; then
            cd packages/cli && npx semantic-release
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          RELEASE_TYPE: ${{ needs.detect-changes.outputs.release-type }}
          CLI_CHANGED: ${{ needs.detect-changes.outputs.cli-changed }}
