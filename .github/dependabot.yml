version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 10
    reviewers:
      - '@calimero-network/maintainers'
    assignees:
      - '@calimero-network/platform-team'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    groups:
      # ⚠️ REACT AND REACT-DOM CANNOT BE UPDATED SEPARATELY, AND DEPENDABOT
      # WILL KEEP TRYING UNLESS IT IS TOLD NOT TO.
      #
      # `src/test/react-version-pairing.test.ts` asserts the two resolve to
      # the same installed version — they share an internal runtime contract
      # and a mismatched pair fails at runtime, not at install. Ungrouped,
      # dependabot opens one PR per package, so each one moves half the pair
      # and is red the moment it is created:
      #
      #   #284  react 19.3.0 vs react-dom 19.2.8  ->  expected '19.2.8' to be '19.3.0'
      #   #286  the mirror image
      #
      # Neither could ever go green on its own. Grouped, they arrive in one
      # PR that passes.
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
    ignore:
      # ⚠️ canonicalize 3+ IS ESM-ONLY, AND THIS REPO REQUIRES IT FROM CJS.
      #
      # v5 ships `"type": "module"` with an `import`-only export map, while
      # `packages/backend/src/lib/verify.js`, `api/lib/verify.js` and
      # `api/lib/signed-request.js` are CommonJS and do
      # `const canonicalize = require('canonicalize')` at module load. The
      # bump (#287) fails as `Cannot find module 'canonicalize'` across six
      # backend suites.
      #
      # Taking it means converting signature-verification code to ESM or to
      # an async dynamic import — a refactor of the security path, for a
      # library that implements a frozen spec (RFC 8785 JCS) and has nothing
      # new to give us. Patches and minors still come through.
      - dependency-name: 'canonicalize'
        update-types:
          - 'version-update:semver-major'
      # ⚠️ TYPESCRIPT 7 NEEDS THE LINT STACK MODERNISED FIRST.
      #
      # It fails two independent ways (#294). `tsc` removed options the
      # frontend config is built on:
      #
      #   TS5108: Option 'moduleResolution=node10' has been removed.
      #   TS5102: Option 'baseUrl' has been removed.
      #
      # and eslint dies before linting anything, because @typescript-eslint
      # v7 and its pinned ts-api-utils read TS internals that moved:
      #
      #   TypeError: Cannot read properties of undefined (reading 'Intrinsic')
      #     at ts-api-utils/lib/index.cjs:779
      #
      # The second one is the blocker and it is not TypeScript's fault. Every
      # package pins @typescript-eslint/eslint-plugin ^7 against a parser a
      # major newer, and the root declares eslint ^8.55.0 while 10.7.0 is
      # what resolves — which is also where the standing `unmet peer
      # eslint@^8.56.0` warnings come from. Align that, migrate the tsconfig,
      # then drop this entry. 5.x patches and minors still come through.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'

  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    reviewers:
      - '@calimero-network/maintainers'
    assignees:
      - '@calimero-network/platform-team'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'

  # Enable version updates for Docker
  #
  # ⚠️ THE DIRECTORY IS WHERE THE DOCKERFILE IS, NOT THE REPO ROOT. This was
  # '/' and there is no Dockerfile there, so the docker leg has never once
  # produced an update — it just fails the scheduled run every week with:
  #
  #   dependency_file_not_found
  #   "No Dockerfiles nor Kubernetes YAML found in /"  (file-path /Dockerfile)
  #
  # A red weekly job that opens nothing looks exactly like a quiet one until
  # you go and read it. Both images live in packages/backend (Dockerfile and
  # Dockerfile.simple), which is also what the CI build and `docker:build`
  # point at.
  - package-ecosystem: 'docker'
    directory: '/packages/backend'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    reviewers:
      - '@calimero-network/maintainers'
    assignees:
      - '@calimero-network/platform-team'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
